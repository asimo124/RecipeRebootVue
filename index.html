<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" sizes="16x16" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipes Admin</title>
    <link rel="stylesheet" href="/assets/css/lib/inter.css" />
    <link rel="stylesheet" href="/assets/css/lib/phosphor.css" />
    <link rel="stylesheet" href="/assets/css/remixicon.css" />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body class="bg-neutral-100 dark:bg-neutral-800 dark:text-white relative z-[1]">
    <div id="app"></div>
    <script>
      (function () {
        var saved = localStorage.getItem('color-theme')
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <script src="/assets/js/lib/jquery-3.7.1.min.js"></script>
    <script src="/assets/js/lib/iconify-icon.min.js"></script>
    <script src="/assets/js/lib/iconify-bundle.js"></script>
    <script src="/assets/js/flowbite.min.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
